name: Release

# Push a tag like v0.2.0 to build StreamClipper.exe and attach the zip to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build exe
        shell: pwsh
        run: |
          python -m venv .venv
          powershell -ExecutionPolicy Bypass -File scripts\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StreamClipper-windows-x64
          path: dist/StreamClipper-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StreamClipper-windows-x64.zip
          generate_release_notes: true
