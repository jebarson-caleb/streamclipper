[project]
name = "streamclipper"
version = "0.1.0"
description = "Local-AI live stream clipper that auto-subtitles clips and schedules them to YouTube"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.16",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.0",
  "opencv-python-headless>=4.9,<5",  # 5.x dropped the Haar CascadeClassifier used for face tracking
  "faster-whisper>=1.0",
  "streamlink>=6.7",
  "yt-dlp[default,curl-cffi]>=2025.10.1",   # curl-cffi: gets past Cloudflare on Kick/Rumble/etc.
  "deno>=2.0",                               # JS runtime yt-dlp needs for YouTube
  "certifi",
  "chat-downloader>=0.2.8",
  "google-api-python-client>=2.120",
  "google-auth-oauthlib>=1.2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
desktop = ["pywebview>=5.0"]                  # native window: `streamclipper desktop`
build = ["pyinstaller>=6.6"]                  # scripts/build.ps1 -> dist/StreamClipper/StreamClipper.exe

[project.scripts]
streamclipper = "streamclipper.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["streamclipper*"]

[tool.setuptools.package-data]
streamclipper = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
