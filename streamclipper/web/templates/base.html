<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ {"home":"Dashboard","channels":"Channels","moments":"Moments","clips":"Clips & queue","settings":"Settings","logs":"Logs"}.get(page, "") }}{% endblock %} · StreamClipper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --paper: #f4f4f4; --ink: #101010; --ink-2: #4a4a4a; --line: #101010; --soft: #e4e3df;
      --blue: #0038ff; --pink: #ff77cd; --cream: #eae9e6; --red: #c8102e; --green: #00794c; --amber: #8a5a00;
      --ease: cubic-bezier(.75, 0, .25, 1);
    }
    html, body { background: var(--paper); color: var(--ink); font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif; }
    body { letter-spacing: -.01em; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; letter-spacing: -.01em; text-transform: none; }
    .display { font-weight: 900; text-transform: uppercase; letter-spacing: -.045em; line-height: .86; }

    /* skip link + focus */
    .skip { position: absolute; left: 1rem; top: -4rem; z-index: 100; background: var(--ink); color: #fff; padding: .6rem 1rem; }
    .skip:focus { top: 1rem; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .dark :focus-visible, .on-dark :focus-visible { outline-color: var(--pink); }

    /* floating pill nav */
    .topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
              gap: 1rem; padding: .9rem 1.25rem; background: rgba(244,244,244,.88); backdrop-filter: blur(10px); }
    .brand { font-family: "Instrument Serif", serif; font-style: italic; font-size: 1.6rem; line-height: 1; color: var(--blue); }
    .pillnav { display: flex; flex-wrap: wrap; gap: .15rem; background: #fff; padding: .3rem; border-radius: 999px;
               box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); }
    .pillnav a { padding: .45rem .85rem; border-radius: 999px; font-size: .78rem; font-weight: 600; text-transform: uppercase;
                 letter-spacing: .02em; color: var(--ink); transition: background .3s var(--ease), color .3s var(--ease); }
    .pillnav a:hover { background: var(--cream); }
    .pillnav a[aria-current="page"] { background: var(--ink); color: #fff; }
    .chip-status { display: inline-flex; align-items: center; gap: .45rem; background: #fff; padding: .45rem .9rem; border-radius: 999px;
                   font-size: .75rem; font-weight: 600; text-transform: uppercase; box-shadow: 0 8px 24px rgba(0,0,0,.06); }

    /* building blocks (names kept for all templates) */
    .card { background: #fff; border: 2px solid var(--ink); padding: 1.25rem; }
    .card-flat { background: #fff; padding: 1.25rem; }
    .tilt-l { transform: rotate(-1.2deg); } .tilt-r { transform: rotate(1.2deg); }
    .frame-blue { border: 6px solid var(--blue); } .frame-pink { border: 6px solid var(--pink); } .frame-ink { border: 6px solid var(--ink); }
    .lift { transition: transform .45s var(--ease); } .lift:hover { transform: rotate(0) translateY(-4px); }

    .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .55rem 1rem; background: #fff; color: var(--ink);
           border: 2px solid var(--ink); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
           white-space: nowrap; transition: background .3s var(--ease), color .3s var(--ease); cursor: pointer; }
    .btn:hover { background: var(--ink); color: #fff; }
    .btn-p { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-p:hover { background: var(--ink); border-color: var(--ink); }
    .btn-d { background: #fff; border-color: var(--red); color: var(--red); }
    .btn-d:hover { background: var(--red); color: #fff; }
    .btn-pink { background: var(--pink); border-color: var(--pink); color: var(--ink); }
    .btn-pink:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
    .arrow { display: inline-grid; place-items: center; width: 1.35rem; height: 1.35rem; background: var(--blue); color: #fff; font-size: .8rem;
             transition: transform .35s var(--ease); }
    .btn-p .arrow, .btn:hover .arrow { background: #fff; color: var(--blue); }
    .btn:hover .arrow, a:hover > .arrow { transform: translateX(3px); }

    input, select, textarea { background: #fff; border: 2px solid var(--ink); padding: .55rem .7rem; width: 100%; font-size: .95rem; color: var(--ink); border-radius: 0; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 4px 4px 0 var(--blue); }
    input:disabled, textarea:disabled { background: var(--cream); color: var(--ink-2); }
    label, .label { display: block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink); margin-bottom: .3rem; }
    .hint { font-size: .8rem; color: var(--ink-2); }
    .pill { display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
            padding: .2rem .6rem; background: var(--cream); color: var(--ink); border: 1px solid var(--ink); }
    .pill-live { background: var(--red); border-color: var(--red); color: #fff; }
    .pill-blue { background: var(--blue); border-color: var(--blue); color: #fff; }
    .pill-pink { background: var(--pink); border-color: var(--pink); color: var(--ink); }
    .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }

    .section-title { font-size: clamp(2.2rem, 5vw, 4rem); }
    .eyebrow { font-family: "Instrument Serif", serif; font-size: 1.35rem; line-height: 1.1; }
    table { border-collapse: collapse; }
    th { text-align: left; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: .5rem .5rem .6rem 0; border-bottom: 2px solid var(--ink); }
    td { padding: .7rem .5rem .7rem 0; border-bottom: 1px solid var(--soft); vertical-align: top; }

    /* dark band like the featured section */
    .on-dark { background: var(--ink); color: #f4f4f4; }
    .on-dark .card { background: #181818; border-color: #f4f4f4; color: #f4f4f4; }
    .on-dark .hint { color: #bdbdbd; }

    /* marquee */
    .marquee { overflow: hidden; border-block: 2px solid var(--ink); background: #fff; }
    .marquee-track { display: flex; width: max-content; gap: 3rem; padding: .9rem 0; animation: marquee 38s linear infinite; }
    .marquee:hover .marquee-track { animation-play-state: paused; }
    .marquee-track span { font-weight: 800; text-transform: uppercase; letter-spacing: -.02em; font-size: 1.15rem; white-space: nowrap; }
    .marquee-track span:nth-child(3n+2) { font-family: "Instrument Serif", serif; font-weight: 400; text-transform: none; font-style: italic; color: var(--blue); }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* rotating badge */
    .badge-spin { position: fixed; right: 1.25rem; bottom: 1.25rem; width: 104px; height: 104px; z-index: 30; display: grid; place-items: center;
                  background: #fff; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    .badge-spin svg { position: absolute; inset: 0; animation: spin 18s linear infinite; }
    .badge-spin .core { width: 46px; height: 46px; border-radius: 999px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 1.2rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* hand-drawn underline */
    .scribble { position: relative; display: inline-block; }
    .scribble svg { position: absolute; left: -2%; bottom: -.12em; width: 104%; height: .32em; overflow: visible; }
    .scribble path { fill: none; stroke: var(--pink); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.1s .55s var(--ease) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* split-line reveal */
    .reveal > .ln { display: block; overflow: hidden; padding-bottom: .04em; }
    .reveal > .ln > span { display: inline-block; transform: translateY(105%); animation: rise .9s var(--ease) forwards; }
    .reveal > .ln:nth-child(2) > span { animation-delay: .08s; } .reveal > .ln:nth-child(3) > span { animation-delay: .16s; }
    @keyframes rise { to { transform: none; } }
    .fade-up { opacity: 0; translate: 0 24px; transition: opacity .8s var(--ease), translate .8s var(--ease), transform .45s var(--ease); }
    .fade-up.in { opacity: 1; translate: none; }

    /* page wipe */
    #wipe { position: fixed; inset: 0; z-index: 90; background: var(--blue); transform: translateY(100%); pointer-events: none; }
    #wipe.cover { transition: transform .45s var(--ease); transform: none; }
    html, body { overflow-x: clip; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal > .ln > span { transform: none; } .fade-up { opacity: 1; translate: none; }
      .scribble path { stroke-dashoffset: 0; } #wipe { display: none; }
    }
    @media (max-width: 767px) {
      .topbar { flex-wrap: wrap; padding: .7rem 1rem; }
      .topbar nav { order: 3; width: 100%; }
      .pillnav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      .pillnav a { display: block; white-space: nowrap; }
      .badge-spin { width: 72px; height: 72px; right: .75rem; bottom: .75rem; }
      .badge-spin .core { width: 34px; height: 34px; font-size: .95rem; }
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body class="min-h-screen">
  <a class="skip" href="#main">Skip to content</a>
  <div id="wipe" aria-hidden="true"></div>

  {% set nav = [("home","Dashboard"),("channels","Channels"),("moments","Moments"),("clips","Clips"),("settings","Settings"),("logs","Logs")] %}
  <header class="topbar">
    <a href="/" class="brand" aria-label="StreamClipper home">StreamClipper</a>
    <nav aria-label="Main">
      <ul class="pillnav">
        {% for key, label in nav %}
        <li><a href="/{{ '' if key=='home' else key }}" {% if page==key %}aria-current="page"{% endif %}>{{ label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <span class="chip-status hidden md:inline-flex"><span aria-hidden="true" class="w-2 h-2 rounded-full" style="background:var(--green)"></span>Local AI</span>
  </header>

  <main id="main" tabindex="-1" class="max-w-6xl mx-auto px-5 pb-28 space-y-6">
    {% block body %}{% endblock %}
  </main>

  <aside aria-label="Shortcut">
  <a href="/clips" class="badge-spin" aria-label="Open clips and queue">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><path id="circ" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs>
      <text font-size="9.5" font-weight="800" fill="#101010"><textPath href="#circ" textLength="234" lengthAdjust="spacing">CLIP · SUBTITLE · SCHEDULE · POST ·</textPath></text>
    </svg>
    <span class="core" aria-hidden="true">✂</span>
  </a>
  </aside>

  <script>
    (() => {
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      // fade sections in as they scroll into view
      const io = "IntersectionObserver" in window && !reduce
        ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 })
        : null;
      const watch = root => root.querySelectorAll(".fade-up:not(.in)").forEach(el => io ? io.observe(el) : el.classList.add("in"));
      watch(document);
      document.body.addEventListener("htmx:afterSwap", e => watch(e.target));
      // blue wipe between pages: covers on link click, slides away on the next page
      const wipe = document.getElementById("wipe");
      const store = { get() { try { return sessionStorage.getItem("sc-wipe"); } catch { return null; } },
                      set(v) { try { v ? sessionStorage.setItem("sc-wipe", "1") : sessionStorage.removeItem("sc-wipe"); } catch {} } };
      const hide = () => { wipe.classList.remove("cover"); wipe.style.transform = "translateY(-100%)"; };
      if (store.get() && !reduce) {
        store.set(false);
        wipe.style.transform = "none";
        const anim = wipe.animate ? wipe.animate([{ transform: "none" }, { transform: "translateY(-100%)" }],
                                                 { duration: 600, delay: 60, easing: "cubic-bezier(.75,0,.25,1)", fill: "forwards" }) : null;
        if (anim) anim.onfinish = hide;
        setTimeout(hide, 900);   // never leave the page covered
      }
      if (!reduce) document.addEventListener("click", e => {
        const a = e.target.closest("a[href^='/']");
        if (!a || a.target || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey ||
            a.getAttribute("href").includes("#") || a.href === location.href) return;
        e.preventDefault();
        store.set(true);
        wipe.getAnimations && wipe.getAnimations().forEach(x => x.cancel());
        wipe.style.transform = ""; void wipe.offsetWidth; wipe.classList.add("cover");
        setTimeout(() => { location.href = a.href; }, 430);
      });
      addEventListener("pageshow", ev => { if (ev.persisted) hide(); });
    })();
  </script>
</body>
</html>
